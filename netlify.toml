[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://api.qrserver.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://images.unsplash.com https://image.pollinations.ai https://pollinations.ai https://api.qrserver.com https://*.supabase.co; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://*.supabase.co wss://*.supabase.co https://api.qrserver.com https://api.frankfurter.app https://api.open-meteo.com https://geocoding-api.open-meteo.com https://nominatim.openstreetmap.org https://image.pollinations.ai https://pollinations.ai https://text.pollinations.ai; media-src 'self' blob: data: https://*.supabase.co; object-src 'none'; frame-ancestors 'none';"
